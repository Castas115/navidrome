apiVersion: v1
kind: ConfigMap
metadata:
  name: navidrome-config
  namespace: music
data:
  ND_MUSICFOLDER: /music
  ND_DATAFOLDER: /data
  ND_CACHEFOLDER: /cache

  # Navidrome resolves this relative to ND_MUSICFOLDER and reimports on every
  # scan, which is how the importer's .m3u output reaches the UI.
  ND_PLAYLISTSPATH: playlists
  ND_AUTOIMPORTPLAYLISTS: "true"

  ND_SCANSCHEDULE: "@every 1h"
  ND_TRANSCODINGCACHESIZE: 1GB
  ND_IMAGECACHESIZE: 500MB
  ND_LOGLEVEL: info
  ND_SESSIONTIMEOUT: 72h

  # Enabling this lets admin users edit ffmpeg command lines from the web UI,
  # which is arbitrary command execution inside the container.
  ND_ENABLETRANSCODINGCONFIG: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: music
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so the old pod has to release it before the new
  # one starts. RollingUpdate would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
      containers:
        - name: navidrome
          # Pinned: :latest makes a rollback impossible to express.
          image: deluan/navidrome:0.63.2
          envFrom:
            - configMapRef:
                name: navidrome-config
          ports:
            - name: http
              containerPort: 4533
          volumeMounts:
            - { name: music, mountPath: /music }
            - { name: data, mountPath: /data }
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        # Rebuilt from the library on demand, so it does not need to survive
        # the pod. emptyDir keeps it off the PV.
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        # readOnlyRootFilesystem leaves nowhere to spool transcodes.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: music
spec:
  type: LoadBalancer
  selector:
    app: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
